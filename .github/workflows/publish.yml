# Builds the site from content/ on every push to main, and publishes it to GitHub Pages
# (mooligan.com) only once the site is launched: when the repository variable PUBLISH is "true"
# (Settings → Secrets and variables → Actions → Variables). Until then each run only builds and
# checks the site, and keeps the result as a “site” artifact to download and look at.
# Publishing also needs Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
      - if: vars.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
