# Every pull request, including the article writer’s: the site must build and pass its checks,
# and the example release kit must still match the kit format. The built site is kept as a
# “site” artifact, to download and look at before merging.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run validate-kit -- examples/release-kit
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
