<svg viewBox="0 0 320 226" xmlns="http://www.w3.org/2000/svg">
  <title>One seat, its upper half for gaining life and its lower half for losing it, with a small tally reading minus seven beside the total.</title>
  <rect class="ln bold" x="70" y="8" width="150" height="210" rx="14"/>
  <rect class="wash" x="75" y="13" width="140" height="95" rx="10"/>
  <line class="ln faint dash" x1="75" y1="113" x2="116" y2="113"/>
  <line class="ln faint dash" x1="174" y1="113" x2="215" y2="113"/>
  <text class="ital" x="145" y="64" text-anchor="middle" style="font-size:22px">+</text>
  <text class="ital" x="145" y="178" text-anchor="middle" style="font-size:22px">−</text>
  <text class="big" x="145" y="113" text-anchor="middle" dominant-baseline="central">13</text>
  <text class="tally" x="178" y="96">−7</text>
  <line class="ln faint" x1="226" y1="58" x2="238" y2="58"/>
  <text class="lab" x="244" y="61">GAIN</text>
  <line class="ln faint" x1="200" y1="92" x2="238" y2="92"/>
  <text class="lab" x="244" y="95">TALLY</text>
  <line class="ln faint" x1="226" y1="172" x2="238" y2="172"/>
  <text class="lab" x="244" y="175">LOSE</text>
</svg>
