<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>The cost three, black, black counted out: three, one and one make five.</title>
  <circle class="ln bg" cx="32" cy="30" r="9"/>
  <text class="t" x="32" y="30.2" font-size="10" text-anchor="middle" dominant-baseline="central" font-weight="600">3</text>
  <circle class="ln bg" cx="60" cy="30" r="9"/>
  <text class="t" x="60" y="30.2" font-size="10" text-anchor="middle" dominant-baseline="central" font-weight="600">B</text>
  <circle class="ln bg" cx="88" cy="30" r="9"/>
  <text class="t" x="88" y="30.2" font-size="10" text-anchor="middle" dominant-baseline="central" font-weight="600">B</text>
  <text class="t" x="32" y="52" font-size="9" text-anchor="middle" dominant-baseline="central" fill-opacity="0.55">+3</text>
  <text class="t" x="60" y="52" font-size="9" text-anchor="middle" dominant-baseline="central" fill-opacity="0.55">+1</text>
  <text class="t" x="88" y="52" font-size="9" text-anchor="middle" dominant-baseline="central" fill-opacity="0.55">+1</text>
  <line class="ln" x1="18" y1="64" x2="102" y2="64"/>
  <text class="t" x="60" y="82" font-size="20" text-anchor="middle" dominant-baseline="central" font-weight="600">5</text>
</svg>
