<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>A panel under the set’s name: its symbol, code, release date and number of cards, and a pack to open.</title>
  <rect class="ln" x="4" y="12" width="112" height="98" rx="9"/>
  <text class="t" x="11" y="24" font-size="7" text-anchor="start" dominant-baseline="central" fill-opacity="0.55">Set Symbol</text>
  <path class="fill" d="M99.5 21.52 L104 19.5 L108.5 21.52 L106.79 27.38 L104 28.5 L101.21 27.38 Z"/>
  <text class="t" x="11" y="40" font-size="7" text-anchor="start" dominant-baseline="central" fill-opacity="0.55">Set Code</text>
  <text class="t" x="109" y="40" font-size="7.5" text-anchor="end" dominant-baseline="central" font-weight="600">TDM</text>
  <line class="ln faint" x1="11" y1="32" x2="109" y2="32"/>
  <text class="t" x="11" y="56" font-size="7" text-anchor="start" dominant-baseline="central" fill-opacity="0.55">Release Date</text>
  <text class="t" x="109" y="56" font-size="7.5" text-anchor="end" dominant-baseline="central" font-weight="600">2025-04-11</text>
  <line class="ln faint" x1="11" y1="48" x2="109" y2="48"/>
  <text class="t" x="11" y="72" font-size="7" text-anchor="start" dominant-baseline="central" fill-opacity="0.55">Number of Cards</text>
  <text class="t" x="109" y="72" font-size="7.5" text-anchor="end" dominant-baseline="central" font-weight="600">286</text>
  <line class="ln faint" x1="11" y1="64" x2="109" y2="64"/>
  <line class="ln" x1="4" y1="84" x2="116" y2="84"/>
  <path class="ln" d="M12 92 L13.5 91 L15 92 L16.5 91 L18 92 L19.5 91 L21 92 L21 103 L19.5 104 L18 103 L16.5 104 L15 103 L13.5 104 L12 103 Z"/>
  <text class="t" x="27" y="97.5" font-size="7.5" text-anchor="start" dominant-baseline="central">Open Play Booster</text>
</svg>
