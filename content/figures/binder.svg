<svg viewBox="0 0 320 330" xmlns="http://www.w3.org/2000/svg">
  <title>A binder page of nine cards, numbered 001 to 009 in order.</title>
  <defs>
    <g id="card3">
      <rect class="ln" x="0" y="0" width="56" height="78" rx="4"/>
      <rect class="ln faint" x="5" y="10" width="46" height="32" rx="1"/>
      <line class="ln faint" x1="5" y1="50" x2="42" y2="50"/>
      <line class="ln faint" x1="5" y1="57" x2="48" y2="57"/>
      <line class="ln faint" x1="5" y1="64" x2="34" y2="64"/>
    </g>
  </defs>
  <rect class="ln bold" x="40" y="4" width="250" height="322" rx="5"/>
  <circle class="ln" cx="54" cy="70" r="4"/>
  <circle class="ln" cx="54" cy="165" r="4"/>
  <circle class="ln" cx="54" cy="260" r="4"/>
  <rect class="wash" x="74" y="18" width="56" height="78" rx="4" style="fill-opacity:0.14"/>
  <use href="#card3" x="74" y="18"/><use href="#card3" x="146" y="18"/><use href="#card3" x="218" y="18"/>
  <use href="#card3" x="74" y="118"/><use href="#card3" x="146" y="118"/><use href="#card3" x="218" y="118"/>
  <use href="#card3" x="74" y="218"/><use href="#card3" x="146" y="218"/><use href="#card3" x="218" y="218"/>
  <g class="lab" text-anchor="middle">
    <text x="102" y="109">001</text><text x="174" y="109">002</text><text x="246" y="109">003</text>
    <text x="102" y="209">004</text><text x="174" y="209">005</text><text x="246" y="209">006</text>
    <text x="102" y="309">007</text><text x="174" y="309">008</text><text x="246" y="309">009</text>
  </g>
</svg>
