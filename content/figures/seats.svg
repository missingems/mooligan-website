<svg viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg">
  <title>A phone lying flat between two players, its screen split into two seats, each total facing its player.</title>
  <text class="lab" x="160" y="10" text-anchor="middle" transform="rotate(180 160 7)">PLAYER TWO</text>
  <rect class="ln bold" x="110" y="24" width="100" height="200" rx="16"/>
  <rect class="wash" x="115" y="29" width="90" height="92" rx="11"/>
  <line class="ln faint" x1="115" y1="124" x2="205" y2="124"/>
  <text class="big" x="160" y="76" text-anchor="middle" dominant-baseline="central" transform="rotate(180 160 76)">20</text>
  <text class="big" x="160" y="172" text-anchor="middle" dominant-baseline="central">20</text>
  <text class="lab" x="160" y="244" text-anchor="middle">PLAYER ONE</text>
  <line class="ln faint" x1="216" y1="76" x2="234" y2="76"/>
  <text class="lab" x="240" y="73">FACES ITS</text>
  <text class="lab" x="240" y="86">PLAYER</text>
  <line class="ln faint" x1="86" y1="124" x2="104" y2="124"/>
  <text class="lab" x="80" y="121" text-anchor="end">ONE SEAT</text>
  <text class="lab" x="80" y="134" text-anchor="end">EACH</text>
</svg>
