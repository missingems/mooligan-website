# Terms linked from the text with [[term]] or [[shown text|term]]. Kept in alphabetical order.

index: [glossary]

terms:
  - term: archetype
    definition: A family of decks that share a plan and most of their cards.
  - term: booster
    definition: A sealed pack of cards. Magic sells several kinds, such as play and collector boosters, each put together differently.
  - term: collector number
    definition: The number printed on a card that fixes its place in its set.
  - term: Commander
    definition: A multiplayer format of hundred-card decks, one copy of each card, led by a legendary creature. Players begin at forty life.
  - term: double-faced card
    definition: A card with a face on each side and no ordinary back.
  - term: finish
    definition: "How a printing is made: nonfoil, foil or etched, among others."
  - term: format
    definition: A set of rules for which cards may be played, such as Standard, Modern or Commander.
  - term: mana value
    definition: The total amount of mana in a card’s cost. Once called converted mana cost.
  - term: metagame
    definition: The decks being played in a format at a given time, and the balance between them.
  - term: mulligan
    definition: To shuffle away an opening hand and draw a new one, keeping one card fewer each time.
  - term: printing
    definition: One appearance of a card in one set, with its own art, number and finishes.
  - term: pull rate
    definition: The chance of opening a particular card in a particular booster.
  - term: rarity
    definition: Common, uncommon, rare or mythic rare, shown by the colour of a card’s set symbol.
  - term: rulings
    definition: Official clarifications of how a card works.
  - term: set
    definition: A release of cards sharing a name, a symbol and a short code.
